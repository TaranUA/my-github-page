/* =================================================================
   3. GEOMETRY HELPERS
   ================================================================= */

/** Build an SVG path for a board outline with per-corner styling. */
function boardPath(w, h, corners) {
  // Resolve each corner to {type, r} where r is the pixel size.
  const c = {};
  ['top_left','top_right','bottom_right','bottom_left'].forEach(k => {
    const cc = (corners && corners[k]) || { type:'square', size:0 };
    c[k] = { type: cc.type, r: cc.type === 'square' ? 0 : (cc.size || 0) * SCALE };
  });
  const tl = c.top_left.r, tr = c.top_right.r, br = c.bottom_right.r, bl = c.bottom_left.r;

  // Corner entry/exit points for a clockwise traversal.
  const tlExit  = { x: tl,   y: 0 };
  const trEntry = { x: w - tr, y: 0 };
  const trExit  = { x: w,    y: tr };
  const brEntry = { x: w,    y: h - br };
  const brExit  = { x: w - br, y: h };
  const blEntry = { x: bl,   y: h };
  const blExit  = { x: 0,    y: h - bl };
  const tlEntry = { x: 0,    y: tl };

  // A corner produces either a rounded arc or a straight line (square/chamfer).
  const seg = (conf, entry, exit) => (
    (conf.type === 'round' && conf.r > 0)
      ? ` A ${conf.r} ${conf.r} 0 0 1 ${exit.x} ${exit.y}`
      : ` L ${exit.x} ${exit.y}`
  );

  let d = `M ${tlExit.x} ${tlExit.y}`;
  d += ` L ${trEntry.x} ${trEntry.y}` + seg(c.top_right,    trEntry, trExit);
  d += ` L ${brEntry.x} ${brEntry.y}` + seg(c.bottom_right, brEntry, brExit);
  d += ` L ${blEntry.x} ${blEntry.y}` + seg(c.bottom_left,  blEntry, blExit);
  d += ` L ${tlEntry.x} ${tlEntry.y}` + seg(c.top_left,     tlEntry, tlExit);
  return d + ' Z';
}

/** Length of the edge (mm): width for top/bottom, height for the sides. */
function alongLen(t, edge) {
  return (edge === 'top' || edge === 'bottom') ? t.width : t.height;
}

/**
 * Position (mm, board-local) of a point `along` an edge from its start corner
 * and `cross` mm inward from that edge:
 *   top    start = top-left,    along = +x
 *   right  start = top-right,   along = +y
 *   bottom start = bottom-left, along = +x
 *   left   start = top-left,    along = +y
 */
function edgeLocal(t, edge, along, cross) {
  const W = t.width, H = t.height;
  if (edge === 'top')    return { x: along, y: cross };
  if (edge === 'bottom') return { x: along, y: H - cross };
  if (edge === 'left')   return { x: cross, y: along };
  return { x: W - cross, y: along };               // right
}

/** mm span a group occupies along its edge (centre-to-centre for pads). */
function groupLength(t, g) {
  if (g.kind === 'connector') return connectorGeom(g.conn).bw;
  const n = (g.pads || []).length;
  return Math.max(0, (n - 1) * (Number(g.spacing) || 6));
}

/**
 * Lay out one edge's ordered groups. List order is primary; each group's
 * `align` (left/center/right) anchors it and groups are pushed forward so they
 * never overlap each other.
 */
function layoutEdge(t, edge) {
  const list = (t.edges && t.edges[edge]) || [];
  if (!list.length) return [];
  const len = alongLen(t, edge);
  const margin = 4, gap = 4;
  const lanes = {};                 // cursor per cross-offset "row"
  const placed = [];
  for (const g of list) {
    const L = groupLength(t, g);
    const lane = g.cross || 0;
    const cursor = lanes[lane] || margin;
    let start = g.align === 'center' ? (len - L) / 2
              : g.align === 'right'  ? len - margin - L
              : margin;
    start = Math.max(start, cursor, margin);
    start = Math.min(start, Math.max(margin, len - margin - L));
    placed.push({ group: g, start, L });
    lanes[lane] = start + L + gap;
  }
  return placed;
}

/** A legacy pad's position along its edge (used only by the old-format migrator). */
function padAlongMM(t, p) {
  const len = alongLen(t, p.edge), off = Number(p.offset) || 0;
  const a = p.align || 'start';
  return a === 'center' ? len / 2 + off : a === 'end' ? len - off : off;
}

/** Unit direction a wire leaves a pad, based on which board edge it sits on. */
function edgeDir(edge) {
  if (edge === 'left')   return { x: -1, y: 0 };
  if (edge === 'right')  return { x:  1, y: 0 };
  if (edge === 'top')    return { x:  0, y: -1 };
  if (edge === 'bottom') return { x:  0, y:  1 };
  return { x: 0, y: 0 };                          // explicit x/y pad: no preferred exit
}

/**
 * Connector geometry (mm) for body + pin layout.
 * Pitch values are stylised where real parts (1.0/1.25 mm) would be too small
 * to click at schematic scale.
 */
function connectorGeom(conn) {
  conn = conn || {};
  const n = Math.max(0, conn.pins || 0);
  switch (conn.type) {
    case 'xt60_male':      return { kind:'xt',  n, pitch: conn.pitch || 5.5, bw:16, bh:9   };
    case 'xt30_male':      return { kind:'xt',  n, pitch: conn.pitch || 4.5, bw:12, bh:7   };
    case 'usb_c_port':     return { kind:'usb', n:0, pitch:0,                bw:9,  bh:3.6 };
    case 'gh1_25_socket': {
      const p = conn.pitch || 3.5;
      return { kind:'gh', n, pitch:p, bw:Math.max(3.5, (n - 1) * p + 2.5), bh:5 };
    }
    default: {                                     // jst_sh_socket
      const p = conn.pitch || 4.0;
      return { kind:'jst', n, pitch:p, bw:Math.max(3, (n - 1) * p + 2.0), bh:4.5 };
    }
  }
}

/** SVG body markup for a connector, drawn centred on the origin. */
function connectorShapes(conn) {
  const g = connectorGeom(conn);
  const bw = g.bw * SCALE, bh = g.bh * SCALE;
  const bx = -bw / 2, by = -bh / 2;
  let s = '';

  if (g.kind === 'xt') {
    s += `<rect class="conn-body-xt" x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="2"/>`;
    for (let i = 0; i < g.n; i++) {
      const dx = (i - (g.n - 1) / 2) * g.pitch * SCALE;
      s += `<circle class="conn-pin-xt" cx="${dx}" cy="0" r="${Math.min(bw, bh) * 0.28}"/>`;
    }
  } else if (g.kind === 'usb') {
    s += `<rect class="conn-body-usb" x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="1.6"/>`;
    s += `<rect class="conn-usb-tongue" x="${bx + bw * 0.18}" y="${by + bh * 0.3}" width="${bw * 0.64}" height="${bh * 0.4}" rx="1"/>`;
    for (let i = 0; i < 4; i++) {
      const dx = bx + bw * (0.28 + i * 0.15);
      s += `<circle class="conn-usb-dot" cx="${dx}" cy="0" r="0.9"/>`;
    }
  } else {
    const bodyCls = g.kind === 'gh' ? 'conn-body-gh' : 'conn-body-jst';
    const keyCls  = g.kind === 'gh' ? 'conn-key-gh'  : 'conn-key-jst';
    s += `<rect class="${bodyCls}" x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="1.5"/>`;
    s += `<rect class="${keyCls}" x="-2" y="${by - 2}" width="4" height="2" rx="1"/>`;
  }
  return s;
}

/** Connector body placed on an edge (local px, rotated for side edges). */
function connectorMarkup(t, edge, item) {
  const geom = connectorGeom(item.group.conn);
  const centerAlong = item.start + item.L / 2;
  const cross = geom.bh / 2 + 0.5;
  const c = edgeLocal(t, edge, centerAlong, cross);
  const rot = edge === 'left' ? 90 : edge === 'right' ? -90 : edge === 'bottom' ? 180 : 0;
  return `<g transform="translate(${c.x * SCALE} ${c.y * SCALE}) rotate(${rot})">`
       + connectorShapes(item.group.conn) + `</g>`;
}

/** Local (px) -> world (px): flip about the board centre, then rotate. */
function localToWorld(comp, local) {
  const t = getTemplate(comp);
  const w = t.width * SCALE, h = t.height * SCALE;
  const cx = w / 2, cy = h / 2;
  let dx = local.x - cx, dy = local.y - cy;
  if (comp.flipX) dx = -dx;
  if (comp.flipY) dy = -dy;
  const rad = (comp.rotation || 0) * Math.PI / 180;
  return {
    x: comp.x + cx + dx * Math.cos(rad) - dy * Math.sin(rad),
    y: comp.y + cy + dx * Math.sin(rad) + dy * Math.cos(rad)
  };
}

/** Rotate (and flip) a local unit direction into world space. */
function dirToWorld(comp, dir) {
  let dx = dir.x, dy = dir.y;
  if (comp.flipX) dx = -dx;
  if (comp.flipY) dy = -dy;
  const rad = (comp.rotation || 0) * Math.PI / 180;
  return {
    x: dx * Math.cos(rad) - dy * Math.sin(rad),
    y: dx * Math.sin(rad) + dy * Math.cos(rad)
  };
}

/** All magnetic targets of a template: solder pads + connector pins (local px). */
function componentTargets(t) {
  const out = [];
  for (const edge of EDGES) {
    for (const item of layoutEdge(t, edge)) {
      const g = item.group;
      if (g.kind === 'connector') {
        const geom = connectorGeom(g.conn);
        const centerAlong = item.start + item.L / 2;
        const cross = geom.bh / 2 + 0.5;
        for (let i = 0; i < geom.n; i++) {
          const along = centerAlong + (i - (geom.n - 1) / 2) * geom.pitch;
          out.push({
            id: `${g.conn.id}_p${i}`,
            label: (g.conn.labels || [])[i] || `PIN${i + 1}`,
            signal_type: (g.conn.signals || [])[i] || '',
            kind: 'pin',
            local: { x: edgeLocal(t, edge, along, cross).x * SCALE,
                     y: edgeLocal(t, edge, along, cross).y * SCALE },
            dir: edgeDir(edge)
          });
        }
      } else {
        g.pads.forEach((p, i) => {
          if (p.visible === false) return;         // sparse-pad visibility
          const along = item.start + i * (Number(g.spacing) || 6);
          const loc = edgeLocal(t, edge, along, PAD_INSET + (g.cross || 0));
          out.push({
            id: p.id, label: p.label, signal_type: p.signal_type,
            kind: 'pad', edge, labelSide: resolveLabelSide(edge, g),
            local: { x: loc.x * SCALE, y: loc.y * SCALE },
            dir: edgeDir(edge)
          });
        });
      }
    }
  }
  return out;
}

/* =================================================================
   4. COLOUR PIPELINE  (signal type / label -> default wire colour)
   ================================================================= */
const WIRE_COLORS = {
  ground:    '#1E1E1E',   // dark gray / black
  power:     '#E53935',   // red
  video:     '#FDD835',   // yellow
  tx:        '#FFFFFF',   // white
  rx:        '#4CAF50',   // green
  telemetry: '#1E88E5',   // blue
  aux:       '#FB8C00'    // orange
};

function signalColor(label, signalType) {
  const s = (signalType || '').toLowerCase();
  const l = (label || '').toLowerCase();
  const lTrim = l.replace(/[+\-]/g, '');

  if (s === 'ground' || l === 'gnd' || l === 'ground' || l === '-' || lTrim === 'gnd') return WIRE_COLORS.ground;
  if (s === 'power_pos' || ['5v','9v','bat','vcc','vbat','+','3v3','12v'].includes(lTrim)) return WIRE_COLORS.power;
  if (s === 'video' || ['cam','vtx','vo','vi','video'].includes(l)) return WIRE_COLORS.video;
  if (s === 'uart_tx' || l === 'tx' || /^t\d+$/.test(l)) return WIRE_COLORS.tx;
  if (s === 'uart_rx' || l === 'rx' || /^r\d+$/.test(l)) return WIRE_COLORS.rx;
  if (s === 'telemetry' || ['crsf','sa','tlm','telemetry'].includes(l)) return WIRE_COLORS.telemetry;
  return WIRE_COLORS.aux;
}

/* =================================================================
   5. VIEWPORT  (pan / zoom / background)
   ================================================================= */

/** Screen coordinates relative to the SVG element (== SVG user units). */
function clientToScreen(e) {
  const r = svg.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function screenToWorld(s) {
  return { x: (s.x - state.pan.x) / state.zoom, y: (s.y - state.pan.y) / state.zoom };
}
function worldToScreen(w) {
  return { x: w.x * state.zoom + state.pan.x, y: w.y * state.zoom + state.pan.y };
}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/** Push pan/zoom into the world group transform. */
function applyTransform() {
  world.setAttribute('transform', `translate(${state.pan.x} ${state.pan.y}) scale(${state.zoom})`);
}

function updateZoomLabel() {
  zoomLabel.textContent = Math.round(state.zoom * 100) + '%';
}

/** Zoom by a factor, keeping screen point `s` fixed under the cursor. */
function zoomAt(s, factor) {
  const wp = screenToWorld(s);
  state.zoom = clamp(state.zoom * factor, MIN_ZOOM, MAX_ZOOM);
  state.pan.x = s.x - wp.x * state.zoom;
  state.pan.y = s.y - wp.y * state.zoom;
  applyTransform();
  updateZoomLabel();
  scheduleSave();
}

/** Apply the selected background mode: fill colour, grid colours, CSS bg. */
function applyBackground() {
  const modes = {
    dark_grid:   { bg:'#0f172a', minor:'#1e293b', major:'#334155', grid:true  },
    light_grid:  { bg:'#f1f5f9', minor:'#e2e8f0', major:'#cbd5e1', grid:true  },
    blueprint:   { bg:'#0b2a4a', minor:'#16385a', major:'#2f6ea8', grid:true  },
    clean_white: { bg:'#ffffff', minor:null,      major:null,      grid:false },
    transparent: { bg:'transparent', grid:false }
  };
  const cfg = modes[state.background] || modes.dark_grid;

  bgFill.setAttribute('fill', cfg.bg === 'transparent' ? 'none' : cfg.bg);

  if (cfg.grid) {
    bgGrid.style.display = '';
    gridMinorPath.setAttribute('stroke', cfg.minor);
    gridMajorPath.setAttribute('stroke', cfg.major);
  } else {
    bgGrid.style.display = 'none';
  }

  if (state.background === 'transparent') {
    svg.classList.add('bg-transparent');
    svg.style.background = '';
  } else {
    svg.classList.remove('bg-transparent');
    svg.style.background = cfg.bg;
  }

  document.body.dataset.bg = state.background;
}

/* =================================================================
   6. RENDER PIPELINE
   ================================================================= */
function esc(str) {
  return String(str).replace(/[&<>"']/g, m => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]
  ));
}
const uid = () => 'w' + Math.random().toString(36).slice(2, 9);

function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

function render() {
  applyBackground();
  renderComponents();   // also rebuilds state._targets
  renderWires();
  renderOverlay();
  updateZoomLabel();
}

/* --- 6a. Components (boards, holes, connectors, pads) --- */
function renderComponents() {
  let svgOut = '';
  const targets = [];   // flat magnetic-target list for snapping

  for (const comp of state.components) {
    const t = getTemplate(comp);
    if (!t) continue;
    const w = t.width * SCALE, h = t.height * SCALE;
    const cx = w / 2, cy = h / 2;
    const rot = comp.rotation || 0;
    const sx = comp.flipX ? -1 : 1, sy = comp.flipY ? -1 : 1;
    const isSel = (selectedId === comp.instance_id);

    // Flip is applied about the centre (before rotation), matching localToWorld.
    svgOut += `<g class="component${isSel ? ' selected' : ''}" data-id="${comp.instance_id}" `
            + `transform="translate(${comp.x} ${comp.y}) rotate(${rot} ${cx} ${cy}) `
            + `translate(${cx} ${cy}) scale(${sx} ${sy}) translate(${-cx} ${-cy})">`;

    // Board body (shadow + fill + inset silkscreen line)
    svgOut += `<path class="board-shadow" d="${boardPath(w, h, t.corners)}" transform="translate(2 3)"/>`;
    svgOut += `<path class="board-body" d="${boardPath(w, h, t.corners)}"/>`;
    svgOut += `<path class="board-inner" d="${boardPath(w - 6, h - 6, t.corners)}" transform="translate(3 3)"/>`;

    // Mounting holes (preset "WxH" span or custom spanX/spanY)
    const mh = t.mounting_holes;
    if (mh && mh.pattern && mh.pattern !== 'none') {
      let spanX, spanY;
      if (mh.pattern === 'custom') { spanX = mh.spanX || 20; spanY = mh.spanY || 20; }
      else { const sp = mh.pattern.split('x').map(Number); spanX = sp[0]; spanY = sp[1]; }
      const ix = (t.width - spanX) / 2, iy = (t.height - spanY) / 2;
      const r = (mh.diameter || 3) / 2 * SCALE;
      [[ix, iy], [t.width - ix, iy], [ix, t.height - iy], [t.width - ix, t.height - iy]]
        .forEach(([mx, my]) => {
          svgOut += `<circle class="hole-copper" cx="${mx * SCALE}" cy="${my * SCALE}" r="${r + 1.1}"/>`;
          svgOut += `<circle class="hole-ring" cx="${mx * SCALE}" cy="${my * SCALE}" r="${r}"/>`;
        });
    }

    // Connector bodies — one per connector group on each edge
    for (const edge of EDGES) {
      for (const item of layoutEdge(t, edge)) {
        if (item.group.kind === 'connector') svgOut += connectorMarkup(t, edge, item);
      }
    }

    // Pads & connector pins (magnetic targets)
    for (const tgt of componentTargets(t)) {
      const local = tgt.local;
      const worldPos = localToWorld(comp, local);
      targets.push({
        compId: comp.instance_id, id: tgt.id, label: tgt.label,
        signal_type: tgt.signal_type, kind: tgt.kind,
        local, world: worldPos, dir: dirToWorld(comp, tgt.dir)
      });

      if (tgt.kind === 'pin') {
        svgOut += `<g class="snap-target" data-comp="${comp.instance_id}" data-target="${tgt.id}">`;
        svgOut += `<circle class="pin-hit" cx="${local.x}" cy="${local.y}" r="6"/>`;
        svgOut += `<circle class="pin-copper" cx="${local.x}" cy="${local.y}" r="2.2"/>`;
        svgOut += `</g>`;
      } else {
        // Label offset follows the group's labelSide (per-row / per-column).
        let lx = local.x, ly = local.y, anchor = 'middle';
        const side = tgt.labelSide;
        if (side === 'left')        { lx -= 8; anchor = 'end'; }
        else if (side === 'right')  { lx += 8; anchor = 'start'; }
        else if (side === 'bottom') { ly += 12; }
        else                        { ly -= 8; }   // 'top'

        svgOut += `<g class="snap-target" data-comp="${comp.instance_id}" data-target="${tgt.id}">`;
        svgOut += `<circle class="pad-hit" cx="${local.x}" cy="${local.y}" r="9"/>`;
        svgOut += `<rect class="pad-copper" x="${local.x - 3.6}" y="${local.y - 3.6}" width="7.2" height="7.2" rx="1.6"/>`;
        svgOut += `<circle class="pad-dot" cx="${local.x}" cy="${local.y}" r="1.2"/>`;
        svgOut += `<text class="pad-label" x="${lx}" y="${ly}" text-anchor="${anchor}">${esc(tgt.label)}</text>`;
        svgOut += `</g>`;
      }
    }

    // Component label below the board
    svgOut += `<text class="comp-label" x="${w / 2}" y="${h + 14}">${esc(comp.label)}</text>`;

    // Selection outline + corner handles (edit mode only)
    if (isSel && state.mode === 'edit') {
      svgOut += `<rect class="sel-box" x="-4" y="-4" width="${w + 8}" height="${h + 8}" rx="3"/>`;
      [[-4, -4], [w + 4, -4], [-4, h + 4], [w + 4, h + 4]].forEach(([hx, hy]) => {
        svgOut += `<circle class="sel-handle" cx="${hx}" cy="${hy}" r="3.2"/>`;
      });
    }
    svgOut += `</g>`;
  }

  layerComponents.innerHTML = svgOut;
  state._targets = targets;
}

/* --- 6b. Wire path: exit each pad along its edge normal, then curve --- */
/**
 * Builds a path that leaves pad `a` in direction `dirA`, enters pad `b`
 * opposing `dirB`, and smoothly joins the two stubs with a cubic Bézier.
 * Either direction may be null (e.g. a free-drawing cursor), in which case
 * that end falls back to a straight join.
 */
function wirePath(a, dirA, b, dirB, route) {
  return route === 'ortho' ? wirePathOrtho(a, dirA, b, dirB) : wirePathBezier(a, dirA, b, dirB);
}

function wirePathBezier(a, dirA, b, dirB) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const dist = Math.hypot(dx, dy) || 1;

  const hasA = dirA && (dirA.x || dirA.y);
  const hasB = dirB && (dirB.x || dirB.y);

  // Stub length grows with separation so short links stay tight.
  const stub = clamp(dist * 0.3, 14, 48);

  const p1 = hasA ? { x: a.x + dirA.x * stub, y: a.y + dirA.y * stub } : { x: a.x, y: a.y };
  const p2 = hasB ? { x: b.x + dirB.x * stub, y: b.y + dirB.y * stub } : { x: b.x, y: b.y };

  // Control points continue each exit/entry direction, giving a clean
  // perpendicular take-off and touchdown.
  const k = clamp(dist * 0.4, 10, 70);
  const c1 = hasA ? { x: p1.x + dirA.x * k, y: p1.y + dirA.y * k }
                   : { x: a.x + dx * 0.5, y: a.y };
  const c2 = hasB ? { x: p2.x + dirB.x * k, y: p2.y + dirB.y * k }
                   : { x: b.x - dx * 0.5, y: b.y };

  let d = `M ${a.x} ${a.y}`;
  if (hasA) d += ` L ${p1.x} ${p1.y}`;
  d += ` C ${c1.x} ${c1.y} ${c2.x} ${c2.y} ${p2.x} ${p2.y}`;
  if (hasB) d += ` L ${b.x} ${b.y}`;
  return d;
}

/**
 * Orthogonal (right-angle) route: leave each pad along its edge normal, join
 * the two stubs with axis-aligned segments, then round the corners slightly.
 */
function wirePathOrtho(a, dirA, b, dirB) {
  const hasA = dirA && (dirA.x || dirA.y);
  const hasB = dirB && (dirB.x || dirB.y);
  const stub = 16;
  const p1 = hasA ? { x: a.x + dirA.x * stub, y: a.y + dirA.y * stub } : { x: a.x, y: a.y };
  const p2 = hasB ? { x: b.x + dirB.x * stub, y: b.y + dirB.y * stub } : { x: b.x, y: b.y };

  const horizA = hasA && dirA.x !== 0;
  const horizB = hasB && dirB.x !== 0;

  const pts = [{ x: a.x, y: a.y }];
  if (hasA) pts.push(p1);

  if (hasA && hasB) {
    if (horizA && horizB) {
      const mx = (p1.x + p2.x) / 2;
      pts.push({ x: mx, y: p1.y }, { x: mx, y: p2.y });
    } else if (!horizA && !horizB) {
      const my = (p1.y + p2.y) / 2;
      pts.push({ x: p1.x, y: my }, { x: p2.x, y: my });
    } else if (horizA) {
      pts.push({ x: p2.x, y: p1.y });
    } else {
      pts.push({ x: p1.x, y: p2.y });
    }
  } else if (hasA) {
    if (horizA) pts.push({ x: p2.x, y: p1.y }); else pts.push({ x: p1.x, y: p2.y });
  } else if (hasB) {
    if (horizB) pts.push({ x: p1.x, y: p2.y }); else pts.push({ x: p2.x, y: p1.y });
  }

  pts.push(p2);
  if (hasB) pts.push({ x: b.x, y: b.y });
  return roundedPolyline(pts, 7);
}

/** SVG path through `pts` with quadratic-rounded corners of radius `r`. */
function roundedPolyline(pts, r) {
  const P = [];
  for (const p of pts) {
    const l = P[P.length - 1];
    if (!l || Math.hypot(p.x - l.x, p.y - l.y) > 0.01) P.push(p);
  }
  if (P.length < 2) return '';
  let d = `M ${P[0].x} ${P[0].y}`;
  for (let i = 1; i < P.length - 1; i++) {
    const prev = P[i - 1], p = P[i], next = P[i + 1];
    const v1 = { x: p.x - prev.x, y: p.y - prev.y };
    const v2 = { x: next.x - p.x, y: next.y - p.y };
    const l1 = Math.hypot(v1.x, v1.y) || 1, l2 = Math.hypot(v2.x, v2.y) || 1;
    const rr = Math.min(r, l1 / 2, l2 / 2);
    const a1 = { x: p.x - v1.x / l1 * rr, y: p.y - v1.y / l1 * rr };
    const a2 = { x: p.x + v2.x / l2 * rr, y: p.y + v2.y / l2 * rr };
    d += ` L ${a1.x} ${a1.y} Q ${p.x} ${p.y} ${a2.x} ${a2.y}`;
  }
  const last = P[P.length - 1];
  return d + ` L ${last.x} ${last.y}`;
}

/** Look up a live magnetic target by component + id. */
function findTarget(compId, targetId) {
  return (state._targets || []).find(x => x.compId === compId && x.id === targetId) || null;
}

/* --- 6c. Committed wires --- */
/** Default wire gauge (AWG) from the source pad's signal type. */
function defaultGauge(signalType) {
  const s = (signalType || '').toLowerCase();
  return (s === 'ground' || s === 'power_pos') ? 18 : 26;
}

/** A contrasting tint of a wire colour, for two-tone "striped" styling. */
function wireTint(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''));
  if (!m) return '#ffffff';
  const n = parseInt(m[1], 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  const c = lum > 0.6
    ? { r: r * 0.32, g: g * 0.32, b: b * 0.32 }                          // light -> darker
    : { r: r + (255 - r) * 0.6, g: g + (255 - g) * 0.6, b: b + (255 - b) * 0.6 };  // dark -> lighter
  const h = v => Math.round(v).toString(16).padStart(2, '0');
  return `#${h(c.r)}${h(c.g)}${h(c.b)}`;
}

function renderWires() {
  let out = '';
  for (const wire of state.wires) {
    const a = findTarget(wire.from.comp, wire.from.target);
    const b = findTarget(wire.to.comp, wire.to.target);
    if (!a || !b) continue;

    const d = wirePath(a.world, a.dir, b.world, b.dir, wire.route || 'bezier');
    const w = gaugeWidth(wire.gauge || 24);
    const sel = (wire.id === selectedWireId) ? ' sel' : '';
    const pattern = wire.pattern || 'solid';
    const dash = (pattern === 'dashed')
      ? `stroke-dasharray:${(w * 2.6).toFixed(1)} ${(w * 1.9).toFixed(1)};`
      : '';

    out += `<path class="wire-casing${sel}" style="stroke-width:${(w + 3).toFixed(1)}px;${dash}" d="${d}"/>`;
    out += `<path class="wire${sel}" style="stroke-width:${w.toFixed(1)}px;${dash}" d="${d}" stroke="${wire.color}"/>`;
    if (pattern === 'striped') {
      const sw = Math.max(1, w * 0.34);
      out += `<path class="wire-stripe" style="stroke-width:${sw.toFixed(2)}px;`
           + `stroke-dasharray:${(w * 1.4).toFixed(1)} ${(w * 1.1).toFixed(1)}" `
           + `d="${d}" stroke="${wireTint(wire.color)}"/>`;
    }
    out += `<path class="wire-hit${sel}" data-wire="${wire.id}" d="${d}"/>`;
  }
  layerWires.innerHTML = out;
}

/* --- 6d. In-progress wire + snap halo --- */
function renderOverlay() {
  let out = '';
  if (interaction && interaction.type === 'wire') {
    const a = interaction.from;                               // live target object
    const bWorld = interaction.snap ? interaction.snap.world : interaction.cursor;
    const bDir = interaction.snap ? interaction.snap.dir : null;
    if (a) {
      const d = wirePath(a.world, a.dir, bWorld, bDir);
      const color = signalColor(a.label, a.signal_type);
      out += `<path class="wire-casing" d="${d}"/>`;
      out += `<path class="wire wire-temp" d="${d}" stroke="${color}"/>`;
    }
    if (interaction.snap) {
      const w = interaction.snap.world;
      out += `<circle class="snap-halo" cx="${w.x}" cy="${w.y}" r="11"/>`;
    }
  }
  layerOverlay.innerHTML = out;
}

/* =================================================================
   7. SNAPPING
   ================================================================= */

/** Grid snap (mm step) for component body positioning. */
function snapToGrid(v) {
  if (!state.gridSnap) return v;                 // snap disabled
  const step = state.gridSnap * SCALE;
  return Math.round(v / step) * step;
}

/**
 * Highest-priority magnetic snap: returns the nearest target whose screen
 * distance is within SNAP_RADIUS_PX, otherwise null. This overrides grid snap
 * while drawing wires.
 */
function findNearestTarget(worldPt) {
  let best = null, bestScreenDist = SNAP_RADIUS_PX;
  for (const t of (state._targets || [])) {
    const dWorld = Math.hypot(t.world.x - worldPt.x, t.world.y - worldPt.y);
    const dScreen = dWorld * state.zoom;         // convert world distance -> screen px
    if (dScreen < bestScreenDist) { bestScreenDist = dScreen; best = t; }
  }
  return best;
}

/* =================================================================
   8. INPUT HANDLING
   ================================================================= */
function onPointerDown(e) {
  if (interaction) return;
  const screen = clientToScreen(e);

  // Pan: middle mouse button, or Space + left button.
  if (e.button === 1 || (spaceDown && e.button === 0)) {
    interaction = { type: 'pan', startScreen: screen, startPan: { ...state.pan } };
    document.body.classList.add('is-panning');
    svg.setPointerCapture(e.pointerId);
    e.preventDefault();
    return;
  }

  if (state.mode !== 'edit' || e.button !== 0) return;

  // Start a wire from a pad / connector pin.
  const padEl = e.target.closest && e.target.closest('.snap-target');
  if (padEl) {
    const from = (state._targets || []).find(
      t => t.compId === padEl.dataset.comp && t.id === padEl.dataset.target
    );
    if (from) {
      interaction = { type: 'wire', from, cursor: screenToWorld(e), snap: null };
      svg.setPointerCapture(e.pointerId);
      e.preventDefault();
      renderOverlay();
    }
    return;
  }

  // Select a wire (thin wires carry a wide invisible hit band).
  const wireEl = e.target.closest && e.target.closest('[data-wire]');
  if (wireEl) {
    selectedWireId = wireEl.dataset.wire;
    selectedId = null;
    renderPanel();
    render();
    e.preventDefault();
    return;
  }

  // Select + drag a component body.
  const compEl = e.target.closest && e.target.closest('.component');
  if (compEl) {
    const comp = state.components.find(c => c.instance_id === compEl.dataset.id);
    if (comp) {
      if (selectedId !== comp.instance_id || selectedWireId) {
        selectedId = comp.instance_id;
        selectedWireId = null;
        renderPanel();
        render();                      // redraw with selection highlight
      }
      const wp = screenToWorld(e);
      interaction = { type: 'drag', comp, offset: { x: wp.x - comp.x, y: wp.y - comp.y } };
      svg.setPointerCapture(e.pointerId);
      e.preventDefault();
    }
    return;
  }

  // Clicking empty canvas clears the current selection.
  if (selectedId || selectedWireId) {
    selectedId = null;
    selectedWireId = null;
    renderPanel();
    render();
  }
}

function onPointerMove(e) {
  if (!interaction) {
    updateHover(e);
    return;
  }
  const screen = clientToScreen(e);

  if (interaction.type === 'pan') {
    state.pan.x = interaction.startPan.x + (screen.x - interaction.startScreen.x);
    state.pan.y = interaction.startPan.y + (screen.y - interaction.startScreen.y);
    applyTransform();

  } else if (interaction.type === 'drag') {
    const wp = screenToWorld(e);
    let nx = wp.x - interaction.offset.x;
    let ny = wp.y - interaction.offset.y;
    nx = snapToGrid(nx);
    ny = snapToGrid(ny);
    interaction.comp.x = nx;
    interaction.comp.y = ny;
    scheduleRender();

  } else if (interaction.type === 'wire') {
    const wp = screenToWorld(e);
    interaction.cursor = wp;
    interaction.snap = findNearestTarget(wp);
    renderOverlay();
  }
}

function onPointerUp(e) {
  if (!interaction) return;

  if (interaction.type === 'wire') {
    const { from, snap } = interaction;
    if (snap && !(snap.compId === from.compId && snap.id === from.id)) {
      // Commit wire; auto-colour & gauge from the source pad's signal type.
      state.wires.push({
        id: uid(),
        from: { comp: from.compId, target: from.id },
        to:   { comp: snap.compId, target: snap.id },
        color: signalColor(from.label, from.signal_type),
        gauge: defaultGauge(from.signal_type),
        pattern: 'solid',
        route: 'bezier'
      });
      scheduleSave();
    }
  } else if (interaction.type === 'drag' || interaction.type === 'pan') {
    scheduleSave();
  }

  if (interaction.type === 'pan') document.body.classList.remove('is-panning');
  interaction = null;
  render();
}

function updateHover(e) {
  if (state.mode !== 'edit') { hoverInfo.textContent = ''; return; }
  const wp = screenToWorld(clientToScreen(e));
  const t = findNearestTarget(wp);
  hoverInfo.textContent = t ? `Snap: ${t.label} (${t.kind})` : '';
}

function onWheel(e) {
  e.preventDefault();
  zoomAt(clientToScreen(e), e.deltaY < 0 ? 1.1 : 1 / 1.1);
}

/* Spacebar pan modifier */
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat) {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;
    spaceDown = true;
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') spaceDown = false;
});

/* =================================================================
   9. TOOLBAR WIRING
   ================================================================= */
document.getElementById('modeSwitch').addEventListener('click', e => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn) return;
  setMode(btn.dataset.mode);
});

function setMode(mode) {
  state.mode = mode;
  document.body.dataset.mode = mode;
  document.querySelectorAll('#modeSwitch button').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode)
  );
  renderPanel();
  scheduleSave();
  render();
}

document.getElementById('bgSelect').addEventListener('change', e => {
  state.background = e.target.value;
  applyBackground();
  scheduleSave();
});

document.getElementById('snapSelect').addEventListener('change', e => {
  state.gridSnap = Number(e.target.value);
  scheduleSave();
});

document.getElementById('zoomIn').addEventListener('click', () =>
  zoomAt({ x: svg.clientWidth / 2, y: svg.clientHeight / 2 }, 1.2));
document.getElementById('zoomOut').addEventListener('click', () =>
  zoomAt({ x: svg.clientWidth / 2, y: svg.clientHeight / 2 }, 1 / 1.2));
document.getElementById('zoomReset').addEventListener('click', () => {
  state.zoom = 1;
  state.pan = { x: 20, y: 20 };
  applyTransform(); updateZoomLabel(); scheduleSave();
});

document.getElementById('resetSetup').addEventListener('click', () => {
  if (!confirm('Reset to the built-in test components and wiring?')) return;
  seedState();
  selectedId = null;
  persist();
  syncUI();
  renderPanel();
  render();
});

/* Place a new instance of the selected library template at the view centre. */
document.getElementById('addComp').addEventListener('click', () => {
  const id = libSelect.value;
  const t = TEMPLATES[id];
  if (!t) return;
  const c = screenToWorld({ x: svg.clientWidth / 2, y: svg.clientHeight / 2 });
  const comp = instantiate(id, t.name, snapToGrid(c.x), snapToGrid(c.y));
  state.components.push(comp);
  selectedId = comp.instance_id;
  renderPanel();
  render();
  scheduleSave();
});

/* =================================================================
   10. TEST FIXTURE + PERSISTENCE
   ================================================================= */

/** Create a placed component with its own editable template copy. */
function instantiate(templateId, label, x, y, instanceId) {
  return {
    instance_id: instanceId || uid(),
    template_id: templateId,
    label: label,
    x: x, y: y,
    rotation: 0,
    flipX: false, flipY: false,
    template: clone(TEMPLATES[templateId])
  };
}

/** Built-in test setup: the full stack, with FC <-> ELRS pre-wired. */
function seedState() {
  state = {
    mode: 'edit',
    background: 'dark_grid',
    gridSnap: 5,
    zoom: 1,
    pan: { x: 20, y: 20 },
    components: [
      instantiate('fc',     'Flight Controller', 330,  90, 'fc_1'),
      instantiate('elrs',   'ELRS Receiver',      60, 120, 'elrs_1'),
      instantiate('esc',    '4-in-1 ESC',        330, 360, 'esc_1'),
      instantiate('vtx',    'Analog VTX',         60, 330, 'vtx_1'),
      instantiate('camera', 'Analog Camera',      60, 560, 'cam_1')
    ],
    wires: [
      { id: uid(), from: { comp:'fc_1', target:'fc_5v1' }, to: { comp:'elrs_1', target:'rx_5v'  }, color: WIRE_COLORS.power  },
      { id: uid(), from: { comp:'fc_1', target:'fc_g1'  }, to: { comp:'elrs_1', target:'rx_gnd' }, color: WIRE_COLORS.ground },
      { id: uid(), from: { comp:'fc_1', target:'fc_t2'  }, to: { comp:'elrs_1', target:'rx_rx'  }, color: WIRE_COLORS.tx     },
      { id: uid(), from: { comp:'fc_1', target:'fc_r2'  }, to: { comp:'elrs_1', target:'rx_tx'  }, color: WIRE_COLORS.rx     }
    ],
    _targets: []
  };
}

/** Serializable slice of state (targets are derived, never stored). */
function serializableState() {
  return {
    mode: state.mode,
    background: state.background,
    gridSnap: state.gridSnap,
    zoom: state.zoom,
    pan: state.pan,
    components: state.components,
    wires: state.wires
  };
}

let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 300);
}
function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(serializableState())); }
  catch (err) { /* storage may be unavailable (private mode) — ignore */ }
}
function loadState() {
  let loaded = null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) loaded = JSON.parse(raw);
  } catch (err) { loaded = null; }

  if (loaded && Array.isArray(loaded.components)) {
    state = loaded;
    state._targets = [];
    state.gridSnap = (state.gridSnap === undefined) ? 5 : state.gridSnap;
    // Migrate older saves that referenced shared templates by id only.
    state.components.forEach(c => {
      if (!c.template) c.template = clone(TEMPLATES[c.template_id] || TEMPLATES.fc);
      migrateTemplate(c.template);
      c.rotation = c.rotation || 0;
      c.flipX = !!c.flipX;
      c.flipY = !!c.flipY;
    });
    // Backfill wire appearance attributes for older saves.
    state.wires = (state.wires || []).map(w => ({
      ...w,
      id: w.id || uid(),
      color: w.color || WIRE_COLORS.aux,
      gauge: w.gauge || 24,
      pattern: w.pattern || 'solid',
      route: w.route || 'bezier'
    }));
  } else {
    seedState();
  }
  selectedId = null;
  selectedWireId = null;
}

/** Reflect loaded state back into the toolbar controls. */
function syncUI() {
  document.body.dataset.mode = state.mode;
  document.querySelectorAll('#modeSwitch button').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === state.mode)
  );
  document.getElementById('bgSelect').value = state.background;
  document.getElementById('snapSelect').value = String(state.gridSnap);
}

/* =================================================================
   11. COMPONENT PROPERTIES PANEL
   ================================================================= */
const CORNER_KEYS = ['top_left', 'top_right', 'bottom_left', 'bottom_right'];
const CORNER_LABELS = { top_left:'Top Left', top_right:'Top Right', bottom_left:'Bottom Left', bottom_right:'Bottom Right' };
const GROUP_ALIGN_OPTS = [['left','Left'], ['center','Center'], ['right','Right']];
const LABEL_SIDES_H = [['top','Top'], ['bottom','Bottom']];     // top/bottom edges
const LABEL_SIDES_V = [['left','Left'], ['right','Right']];      // left/right edges
const SIGNAL_OPTS = [
  ['ground','GND'], ['power_pos','PWR'], ['video','VID'],
  ['uart_tx','TX'], ['uart_rx','RX'], ['telemetry','TLM'], ['aux','AUX']
];
const HOLE_PATTERNS = ['none', '12x12', '16x16', '20x20', '25.5x25.5', '30.5x30.5', 'custom'];
const CONN_NAMES = { jst_sh_socket:'JST-SH', gh1_25_socket:'GH1.25', xt60_male:'XT60', xt30_male:'XT30', usb_c_port:'USB-C' };
const CONN_TYPES = Object.keys(CONN_NAMES);

function selectedComponent() { return state.components.find(c => c.instance_id === selectedId) || null; }
function selectedWire() { return selectedWireId ? (state.wires.find(w => w.id === selectedWireId) || null) : null; }
function compLabel(id) { const c = state.components.find(c => c.instance_id === id); return c ? c.label : id; }
function num(v, fallback) { const n = parseFloat(v); return isNaN(n) ? fallback : n; }
function option(value, label, current) {
  const on = String(value) === String(current) ? ' selected' : '';
  return `<option value="${value}"${on}>${label}</option>`;
}

/* ---- Edge / group editor markup ---- */
function alignSelect(group) {
  return `<select data-group-align="${group.id}" title="Anchor on edge">`
    + GROUP_ALIGN_OPTS.map(([v, l]) => option(v, l, group.align || 'center')).join('')
    + `</select>`;
}

function padRowHTML(p, edge, groupId) {
  return `<div class="pad-item" draggable="true" data-pad="${p.id}" data-group="${groupId}" data-edge="${edge}">
    <div class="pad-line">
      <span class="pad-grip" title="Drag to reorder">&#8942;</span>
      <input type="checkbox" data-pad-vis="${p.id}" ${p.visible === false ? '' : 'checked'} title="Visible / active">
      <input type="text" data-pad="${p.id}" data-prop="label" value="${esc(p.label)}" title="Pad label">
      <select class="grow" data-pad="${p.id}" data-prop="signal_type" title="Signal type">
        ${SIGNAL_OPTS.map(([v, l]) => option(v, l, p.signal_type)).join('')}
      </select>
      <button class="pad-del" data-action="del-pad" data-pad="${p.id}" title="Delete pad">&times;</button>
    </div>
  </div>`;
}

function groupCardHTML(t, edge, item) {
  const g = item.group;
  if (g.kind === 'connector') {
    const geom = connectorGeom(g.conn);
    return `<div class="grp-card" draggable="true" data-group="${g.id}" data-edge="${edge}">
      <div class="grp-head">
        <span class="grp-grip" title="Drag to reorder">&#8942;</span>
        <span class="grp-kind">${CONN_NAMES[g.conn.type] || g.conn.type}</span>
        ${alignSelect(g)}
        <button class="pad-del" data-action="del-group" data-group="${g.id}" title="Delete group">&times;</button>
      </div>
      <div class="pad-line">
        <span class="pad-tag">Type</span>
        <select class="grow" data-group-conn-type="${g.id}">
          ${CONN_TYPES.map(tp => option(tp, CONN_NAMES[tp], g.conn.type)).join('')}
        </select>
        <span class="pad-tag">Pins</span>
        <input class="pos-in" type="number" min="0" step="1" data-group-conn-pins="${g.id}"
               value="${geom.n || 0}" title="Pin count">
      </div>
    </div>`;
  }

  const padsHTML = (g.pads || []).map(p => padRowHTML(p, edge, g.id)).join('')
    || '<p class="pp-hint">No pads &mdash; drag one here.</p>';
  const sides = (edge === 'top' || edge === 'bottom') ? LABEL_SIDES_H : LABEL_SIDES_V;
  const labelCur = resolveLabelSide(edge, g);
  return `<div class="grp-card" draggable="true" data-group="${g.id}" data-edge="${edge}">
    <div class="grp-head">
      <span class="grp-grip" title="Drag to reorder">&#8942;</span>
      <span class="grp-kind">${g.name ? esc(g.name) : 'Pads'} &middot; ${(g.pads || []).length}</span>
      ${alignSelect(g)}
      <button class="pad-del" data-action="del-group" data-group="${g.id}" title="Delete group">&times;</button>
    </div>
    <div class="pad-line">
      <span class="pad-tag">Gap</span>
      <input class="pos-in" type="number" min="1" step="0.5" data-group-spacing="${g.id}"
             value="${g.spacing != null ? g.spacing : 6}" title="Pad spacing (mm)">
      <span class="pad-tag">Labels</span>
      <select class="grow" data-group-label="${g.id}" title="Which side the labels sit on">
        ${sides.map(([v, l]) => option(v, l, labelCur)).join('')}
      </select>
    </div>
    <div class="pad-line">
      <button data-action="add-pad" data-group="${g.id}">+ Pad</button>
    </div>
    <div class="grp-pads" data-group-drop="${g.id}">${padsHTML}</div>
  </div>`;
}

function edgeSectionHTML(t, edge) {
  const items = layoutEdge(t, edge);
  return `<div class="edge-sec">
    <div class="edge-title">${edge}</div>
    <div class="grp-list" data-edge="${edge}">
      ${items.map(it => groupCardHTML(t, edge, it)).join('') || '<p class="pp-hint">Empty.</p>'}
    </div>
    <div class="pp-btnrow">
      <button data-action="add-group" data-edge="${edge}" data-kind="pads">+ Pads</button>
      <button data-action="add-group" data-edge="${edge}" data-kind="connector">+ Connector</button>
    </div>
  </div>`;
}

/** Find a group by id across all edges. */
function findGroupId(t, id) {
  for (const edge of EDGES) {
    const list = (t.edges && t.edges[edge]) || [];
    const idx = list.findIndex(g => g.id === id);
    if (idx >= 0) return { edge, list, idx, group: list[idx] };
  }
  return null;
}

/** Find a pad by id, plus its containing group. */
function findPadAnywhere(t, id) {
  for (const edge of EDGES) {
    for (const g of ((t.edges && t.edges[edge]) || [])) {
      if (g.kind !== 'pads') continue;
      const idx = (g.pads || []).findIndex(p => p.id === id);
      if (idx >= 0) return { edge, group: g, idx, pad: g.pads[idx] };
    }
  }
  return null;
}

/** Build (or hide) the properties panel for the current selection. */
function renderPanel() {
  if (state.mode !== 'edit') { panel.classList.remove('open'); panel.innerHTML = ''; return; }
  const wire = selectedWire();
  if (wire) { renderWirePanel(wire); return; }
  const comp = selectedComponent();
  if (!comp) { panel.classList.remove('open'); panel.innerHTML = ''; return; }
  const t = getTemplate(comp);
  const mh = t.mounting_holes || (t.mounting_holes = { pattern:'none', diameter:3 });

  const cornersHTML = CORNER_KEYS.map(k => {
    const c = t.corners[k] || (t.corners[k] = { type:'square', size:0 });
    return `<div class="pp-corner">
      <span>${CORNER_LABELS[k]}</span>
      <select data-corner="${k}" data-prop="type">
        ${option('square','Square',c.type)}${option('round','Round',c.type)}${option('chamfer','Chamfer',c.type)}
      </select>
      <input type="number" min="0" step="0.5" data-corner="${k}" data-prop="size" value="${c.size || 0}" title="Size (mm)">
    </div>`;
  }).join('');

  const customHoles = mh.pattern === 'custom'
    ? `<div class="pp-grid2">
         <input type="number" min="1" step="0.5" data-hole="spanX" value="${mh.spanX || 20}" title="Span X (mm)">
         <input type="number" min="1" step="0.5" data-hole="spanY" value="${mh.spanY || 20}" title="Span Y (mm)">
       </div>` : '';

  const edgesHTML = EDGES.map(edge => edgeSectionHTML(t, edge)).join('');

  panel.innerHTML = `
    <div class="pp-head">
      <h2>${esc(comp.label)}</h2>
      <button class="pp-close" data-action="close" title="Deselect">&times;</button>
    </div>

    <div class="pp-section">
      <h3>Transform</h3>
      <div class="pp-row"><label>Label</label><input type="text" data-field="label" value="${esc(comp.label)}"></div>
      <div class="pp-grid2">
        <div class="pp-row"><label>X (mm)</label><input type="number" step="0.5" data-field="x" value="${(comp.x / SCALE).toFixed(1)}"></div>
        <div class="pp-row"><label>Y (mm)</label><input type="number" step="0.5" data-field="y" value="${(comp.y / SCALE).toFixed(1)}"></div>
      </div>
      <div class="pp-row"><label>Rotation</label><input type="number" step="1" data-field="rotation" value="${comp.rotation || 0}"></div>
      <div class="pp-btnrow">
        <button data-action="rot-90">-90&deg;</button>
        <button data-action="rot90">+90&deg;</button>
        <button data-action="flipx" class="${comp.flipX ? 'on' : ''}">Flip H</button>
        <button data-action="flipy" class="${comp.flipY ? 'on' : ''}">Flip V</button>
      </div>
    </div>

    <div class="pp-section">
      <h3>Board</h3>
      <div class="pp-grid2">
        <div class="pp-row"><label>W (mm)</label><input type="number" min="4" step="0.5" data-field="w" value="${t.width}"></div>
        <div class="pp-row"><label>H (mm)</label><input type="number" min="4" step="0.5" data-field="h" value="${t.height}"></div>
      </div>
    </div>

    <div class="pp-section"><h3>Corners</h3>${cornersHTML}</div>

    <div class="pp-section"><h3>Mounting Holes</h3>
      <div class="pp-row"><label>Pattern</label>
        <select data-hole="pattern">${HOLE_PATTERNS.map(p => option(p, p === 'none' ? 'None' : p, mh.pattern)).join('')}</select>
      </div>
      <div class="pp-row"><label>&#8960; (mm)</label><input type="number" min="0" step="0.1" data-hole="diameter" value="${mh.diameter || 3}"></div>
      ${customHoles}
    </div>

    <div class="pp-section"><h3>Pads &amp; Connectors</h3>
      <p class="pp-hint">Each edge lists groups top-to-bottom. Drag &#8942; to reorder or move a group/pad to another edge. Anchor = Left / Center / Right.</p>
      ${edgesHTML}
    </div>

    <div class="pp-section">
      <div class="pp-btnrow">
        <button class="pp-danger" data-action="del-comp">Delete Component</button>
      </div>
    </div>`;

  positionPanel();
  panel.classList.add('open');
}

/** Properties panel for a selected wire. */
function renderWirePanel(wire) {
  const a = findTarget(wire.from.comp, wire.from.target);
  const b = findTarget(wire.to.comp, wire.to.target);
  const end = t => t ? `${compLabel(t.compId)} · ${t.label || t.id}` : '?';

  panel.innerHTML = `
    <div class="pp-head">
      <h2>Wire</h2>
      <button class="pp-close" data-action="close" title="Deselect">&times;</button>
    </div>

    <div class="pp-section">
      <h3>Connection</h3>
      <p class="pp-hint">${esc(end(a))} &rarr; ${esc(end(b))}</p>
    </div>

    <div class="pp-section">
      <h3>Appearance</h3>
      <div class="pp-row"><label>Color</label>
        <input type="color" data-wire-prop="color" value="${wire.color || WIRE_COLORS.aux}">
      </div>
      <div class="pp-row"><label>Gauge</label>
        <select data-wire-prop="gauge">
          ${GAUGE_OPTS.map(g => option(g, g + ' AWG', wire.gauge || 24)).join('')}
        </select>
      </div>
      <div class="pp-row"><label>Style</label>
        <select data-wire-prop="pattern">
          ${option('solid',   'Solid',   wire.pattern || 'solid')}
          ${option('dashed',  'Dashed',  wire.pattern || 'solid')}
          ${option('striped', 'Striped', wire.pattern || 'solid')}
        </select>
      </div>
      <div class="pp-row"><label>Route</label>
        <select data-wire-prop="route">
          ${option('bezier', 'Curved',      wire.route || 'bezier')}
          ${option('ortho',  'Right-angle', wire.route || 'bezier')}
        </select>
      </div>
    </div>

    <div class="pp-section">
      <div class="pp-btnrow"><button class="pp-danger" data-action="del-wire">Delete Wire</button></div>
    </div>`;

  positionPanel();
  panel.classList.add('open');
}

/** Apply a scalar transform/board field (values not rebuilt into the panel). */
function applyCompField(comp, t, field, value) {
  switch (field) {
    case 'label':    comp.label = value; break;
    case 'x':        comp.x = num(value, comp.x / SCALE) * SCALE; break;
    case 'y':        comp.y = num(value, comp.y / SCALE) * SCALE; break;
    case 'rotation': comp.rotation = num(value, comp.rotation || 0); break;
    /* Board size only changes the outline: pad/connector positions are derived
       from the edge layout, so they reflow automatically. */
    case 'w': t.width  = Math.max(4, num(value, t.width));  break;
    case 'h': t.height = Math.max(4, num(value, t.height)); break;
  }
}

/** Button actions for a selected wire. */
function doWireAction(action, wire) {
  if (action === 'close') { selectedWireId = null; renderPanel(); render(); return; }
  if (action === 'del-wire') {
    state.wires = state.wires.filter(w => w.id !== wire.id);
    selectedWireId = null;
    renderPanel(); render(); scheduleSave(); return;
  }
}

/** Remove any wires attached to one of a component's target ids. */
function dropWiresForTargets(compId, targetIds) {
  const set = new Set(targetIds);
  state.wires = state.wires.filter(w =>
    !(w.from.comp === compId && set.has(w.from.target)) &&
    !(w.to.comp   === compId && set.has(w.to.target)));
}

/** Button actions from the panel. */
function doPanelAction(actionEl, comp, t) {
  const action = actionEl.dataset.action;
  switch (action) {
    case 'close':  selectedId = null; renderPanel(); render(); return;
    case 'rot-90': comp.rotation = (comp.rotation || 0) - 90; break;
    case 'rot90':  comp.rotation = (comp.rotation || 0) + 90; break;
    case 'flipx':  comp.flipX = !comp.flipX; break;
    case 'flipy':  comp.flipY = !comp.flipY; break;

    case 'add-group': {
      t.edges = t.edges || {};
      const edge = actionEl.dataset.edge;
      const list = t.edges[edge] || (t.edges[edge] = []);
      if (actionEl.dataset.kind === 'connector') {
        list.push(connGroup('g' + uid(), 'center',
          { id: 'c' + uid(), type: 'jst_sh_socket', pins: 4, pitch: 4 }));
      } else {
        list.push(padsGroup('g' + uid(), 'center', 5, [
          { id: 'p' + uid(), label: 'NEW', signal_type: 'aux', visible: true } ]));
      }
      renderPanel(); render(); scheduleSave(); return;
    }

    case 'del-group': {
      const hit = findGroupId(t, actionEl.dataset.group);
      if (hit) {
        const ids = [];
        const g = hit.group;
        if (g.kind === 'connector') {
          const n = connectorGeom(g.conn).n || 0;
          for (let i = 0; i < n; i++) ids.push(`${g.conn.id}_p${i}`);
        } else {
          g.pads.forEach(p => ids.push(p.id));
        }
        dropWiresForTargets(comp.instance_id, ids);
        hit.list.splice(hit.idx, 1);
      }
      renderPanel(); render(); scheduleSave(); return;
    }

    case 'add-pad': {
      const hit = findGroupId(t, actionEl.dataset.group);
      if (hit && hit.group.kind === 'pads') {
        hit.group.pads.push({ id: 'p' + uid(), label: 'NEW', signal_type: 'aux', visible: true });
      }
      renderPanel(); render(); scheduleSave(); return;
    }

    case 'del-pad': {
      const hit = findPadAnywhere(t, actionEl.dataset.pad);
      if (hit) {
        dropWiresForTargets(comp.instance_id, [hit.pad.id]);
        hit.group.pads.splice(hit.idx, 1);
      }
      renderPanel(); render(); scheduleSave(); return;
    }

    case 'del-comp':
      state.components = state.components.filter(c => c.instance_id !== comp.instance_id);
      state.wires = state.wires.filter(w =>
        w.from.comp !== comp.instance_id && w.to.comp !== comp.instance_id);
      selectedId = null; renderPanel(); render(); scheduleSave(); return;
  }
  renderPanel(); render(); scheduleSave();
}

/** Central panel event handler (input / change / click). */
function handlePanel(e) {
  const wire = selectedWire();
  if (wire) {
    const actionEl = e.target.closest('[data-action]');
    if (actionEl) { doWireAction(actionEl.dataset.action, wire); return; }
    const wp = e.target.closest('[data-wire-prop]');
    if (wp) {
      const p = wp.dataset.wireProp;
      wire[p] = (p === 'gauge') ? num(wp.value, wire.gauge || 24) : wp.value;
      render(); scheduleSave();
    }
    return;
  }

  const comp = selectedComponent();
  if (!comp) return;
  const t = getTemplate(comp);

  const actionEl = e.target.closest('[data-action]');
  if (actionEl) { doPanelAction(actionEl, comp, t); return; }

  const visEl = e.target.closest('[data-pad-vis]');
  if (visEl) {
    const hit = findPadAnywhere(t, visEl.dataset.padVis);
    if (hit) { hit.pad.visible = visEl.checked; render(); scheduleSave(); }
    return;
  }

  const grpAlign = e.target.closest('[data-group-align]');
  if (grpAlign) {
    const hit = findGroupId(t, grpAlign.dataset.groupAlign);
    if (hit) { hit.group.align = grpAlign.value; render(); scheduleSave(); }
    return;
  }

  const grpSpace = e.target.closest('[data-group-spacing]');
  if (grpSpace) {
    const hit = findGroupId(t, grpSpace.dataset.groupSpacing);
    if (hit) {
      hit.group.spacing = Math.max(1, num(grpSpace.value, hit.group.spacing || 6));
      render(); scheduleSave();
    }
    return;
  }

  const grpLabel = e.target.closest('[data-group-label]');
  if (grpLabel) {
    const hit = findGroupId(t, grpLabel.dataset.groupLabel);
    if (hit) { hit.group.labelSide = grpLabel.value; render(); scheduleSave(); }
    return;
  }

  const grpConnType = e.target.closest('[data-group-conn-type]');
  if (grpConnType) {
    const hit = findGroupId(t, grpConnType.dataset.groupConnType);
    if (hit && hit.group.kind === 'connector') {
      hit.group.conn.type = grpConnType.value;
      renderPanel(); render(); scheduleSave();
    }
    return;
  }

  const grpConnPins = e.target.closest('[data-group-conn-pins]');
  if (grpConnPins) {
    const hit = findGroupId(t, grpConnPins.dataset.groupConnPins);
    if (hit && hit.group.kind === 'connector') {
      hit.group.conn.pins = Math.max(0, num(grpConnPins.value, hit.group.conn.pins || 0));
      render(); scheduleSave();
    }
    return;
  }

  const padEl = e.target.closest('[data-pad]');
  if (padEl && padEl.dataset.prop) {
    const hit = findPadAnywhere(t, padEl.dataset.pad);
    if (hit) { hit.pad[padEl.dataset.prop] = padEl.value; render(); scheduleSave(); }
    return;
  }

  const cornerEl = e.target.closest('[data-corner]');
  if (cornerEl) {
    const pr = cornerEl.dataset.prop;
    const c = t.corners[cornerEl.dataset.corner];
    if (c) { c[pr] = (pr === 'size') ? num(cornerEl.value, c.size) : cornerEl.value; render(); scheduleSave(); }
    return;
  }

  const holeEl = e.target.closest('[data-hole]');
  if (holeEl) {
    const key = holeEl.dataset.hole;
    t.mounting_holes[key] = ['diameter', 'spanX', 'spanY'].includes(key)
      ? num(holeEl.value, t.mounting_holes[key]) : holeEl.value;
    if (key === 'pattern') renderPanel();
    render(); scheduleSave();
    return;
  }

  const field = e.target.dataset.field;
  if (field) { applyCompField(comp, t, field, e.target.value); render(); scheduleSave(); }
}

/* =================================================================
   11b. GROUP / PAD DRAG-AND-DROP
   ================================================================= */
let dragCtx = null;          // { type:'pad'|'group', id }

/** Resolve the drop target under the cursor (shared by dragover + drop). */
function dropZone(target, clientY) {
  const padEl = target.closest('.pad-item');
  if (padEl) {
    const r = padEl.getBoundingClientRect();
    return { groupId: padEl.dataset.group, padId: padEl.dataset.pad,
             edge: padEl.dataset.edge, before: clientY < r.top + r.height / 2 };
  }
  const grpPads = target.closest('.grp-pads');
  if (grpPads) {
    const card = grpPads.closest('[data-edge]');
    return { groupId: grpPads.dataset.groupDrop, edge: card ? card.dataset.edge : null };
  }
  const card = target.closest('.grp-card');
  if (card) return { groupId: card.dataset.group, edge: card.dataset.edge };
  const list = target.closest('.grp-list');
  if (list) return { edge: list.dataset.edge };
  const sec = target.closest('.edge-sec');
  if (sec) { const l = sec.querySelector('.grp-list'); return { edge: l ? l.dataset.edge : null }; }
  return null;
}

function clearDropMarks() {
  panel.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
}

function removeGroupById(t, id) {
  for (const edge of EDGES) {
    const list = (t.edges && t.edges[edge]) || [];
    const i = list.findIndex(g => g.id === id);
    if (i >= 0) { list.splice(i, 1); return true; }
  }
  return false;
}

/** A `pads` group on `edge` — the first one, creating it if none exists. */
function padsGroupOn(t, edge) {
  const list = t.edges[edge] || (t.edges[edge] = []);
  let g = list.find(x => x.kind === 'pads');
  if (!g) { g = padsGroup('g' + uid(), 'center', 6, []); list.push(g); }
  return g;
}

function onPanelDragStart(e) {
  const padEl = e.target.closest('.pad-item');
  if (padEl) {
    dragCtx = { type: 'pad', id: padEl.dataset.pad };
  } else {
    const grpEl = e.target.closest('.grp-card');
    if (!grpEl) return;
    dragCtx = { type: 'group', id: grpEl.dataset.group };
  }
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragCtx.id);
}

function onPanelDragOver(e) {
  if (!dragCtx) return;
  const zone = dropZone(e.target, e.clientY);
  if (!zone) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  clearDropMarks();
  const el = zone.padId ? panel.querySelector(`.pad-item[data-pad="${zone.padId}"]`)
    : zone.groupId ? panel.querySelector(`.grp-card[data-group="${zone.groupId}"]`)
    : panel.querySelector(`.grp-list[data-edge="${zone.edge}"]`);
  if (el) el.classList.add('drop-target');
}

function onPanelDragEnd() { dragCtx = null; clearDropMarks(); }

function onPanelDrop(e) {
  if (!dragCtx) return;
  const zone = dropZone(e.target, e.clientY);
  if (!zone) return;
  e.preventDefault();
  const comp = selectedComponent();
  if (!comp) return;
  const t = getTemplate(comp);
  applyDrop(t, zone);
  dragCtx = null;
  clearDropMarks();
  renderPanel(); render(); scheduleSave();
}

function applyDrop(t, zone) {
  if (dragCtx.type === 'pad') {
    movePadDrop(t, zone);
  } else {
    moveGroupDrop(t, zone);
  }
}

function movePadDrop(t, zone) {
  const src = findPadAnywhere(t, dragCtx.id);
  if (!src) return;
  const pad = src.group.pads[src.idx];

  let dest = null;
  if (zone.groupId) {
    const g = findGroupId(t, zone.groupId);
    if (g && g.group.kind === 'pads') dest = g.group;
  }
  if (!dest && zone.edge) dest = padsGroupOn(t, zone.edge);
  if (!dest) return;                                  // dropped somewhere invalid

  src.group.pads.splice(src.idx, 1);
  let idx = dest.pads.length;
  if (zone.padId && dest.pads.some(p => p.id === zone.padId)) {
    const at = dest.pads.findIndex(p => p.id === zone.padId);
    idx = zone.before ? at : at + 1;
  }
  dest.pads.splice(idx, 0, pad);
  if (src.group.pads.length === 0 && src.group.id !== dest.id) removeGroupById(t, src.group.id);
}

function moveGroupDrop(t, zone) {
  const src = findGroupId(t, dragCtx.id);
  if (!src) return;
  const destEdge = zone.edge || src.edge;
  if (!t.edges[destEdge]) t.edges[destEdge] = [];

  const [g] = src.list.splice(src.idx, 1);
  const destList = t.edges[destEdge];
  let idx = destList.length;
  const ref = (zone.groupId && zone.groupId !== g.id) ? zone.groupId : null;
  if (ref) { const at = destList.findIndex(x => x.id === ref); idx = at >= 0 ? at : destList.length; }
  destList.splice(idx, 0, g);
  if (src.edge !== destEdge) g.align = 'center';
}

/* =================================================================
   12. BOOT
   ================================================================= */
function populateLibrary() {
  Object.keys(TEMPLATES).forEach(k => {
    const o = document.createElement('option');
    o.value = k;
    o.textContent = TEMPLATES[k].name;
    libSelect.appendChild(o);
  });
}

function positionPanel() {
  const header = document.querySelector('header');
  if (header) panel.style.top = (header.offsetHeight + 8) + 'px';
}

function init() {
  populateLibrary();
  loadState();
  syncUI();
  applyTransform();
  render();
  positionPanel();
  renderPanel();
}

window.addEventListener('resize', positionPanel);

/* Panel events (delegated). */
panel.addEventListener('input', handlePanel);
panel.addEventListener('change', handlePanel);
panel.addEventListener('click', handlePanel);
panel.addEventListener('dragstart', onPanelDragStart);
panel.addEventListener('dragover', onPanelDragOver);
panel.addEventListener('drop', onPanelDrop);
panel.addEventListener('dragend', onPanelDragEnd);

svg.addEventListener('pointerdown', onPointerDown);
svg.addEventListener('pointermove', onPointerMove);
svg.addEventListener('pointerup', onPointerUp);
svg.addEventListener('pointercancel', onPointerUp);
svg.addEventListener('wheel', onWheel, { passive: false });
svg.addEventListener('contextmenu', e => e.preventDefault());

init();
</script>
</body>
</html>
